name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us diagnose and fix the issue.

        Please do not paste unpublished manuscript text or paywalled source text. A short made-up example that shows the same problem is ideal.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have read the README, including the Limitations section
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the plugin is affected?
      options:
        - check-paper (full pipeline)
        - Reading the manuscript (ingest)
        - Reference lookup and source download
        - add-source / request-sources / fetch-sources
        - Verdicts and quote checking
        - HTML report
        - suggest-edits and Word export
        - recheck / carry-over to a new draft
        - Installation
        - Other
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where were you running it?
      description: The plugin behaves differently in each, so this matters.
      options:
        - Claude Code in a terminal
        - Claude desktop app, Code tab
        - Claude desktop app, Cowork
        - claude.ai chat or the desktop app's Chat tab
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Asked Claude to '...'
        2. The skill ran `pl.py ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please provide your environment details
      placeholder: |
        - OS: [e.g., macOS 15, Ubuntu 24.04, Windows 11]
        - Claude Code version: [output of `claude --version`]
        - Athetize version: [at the foot of the report, or from `claude plugin list`]
        - Python version: [e.g., 3.11.5]
        - Output of `pl.py doctor` (remove your email address)
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages/Logs
      description: Please include any relevant error messages or script output
      placeholder: Paste error messages or logs here...
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information that might be helpful...

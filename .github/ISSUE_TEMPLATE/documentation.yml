name: 📚 Documentation Issue
description: Report an issue with documentation or suggest improvements
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation! Please provide details about the documentation issue or improvement.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true

  - type: dropdown
    id: type
    attributes:
      label: Documentation Issue Type
      description: What type of documentation issue is this?
      options:
        - Missing information
        - Incorrect or outdated information
        - Unclear instructions
        - Typo or formatting
        - Skill or agent instructions
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where
      description: File and section, for example `README.md` > Install, or `athetize/skills/check-paper/SKILL.md`
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is wrong or missing
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      placeholder: How should it read instead?

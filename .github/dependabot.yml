version: 2
updates:
  # Contributor tooling (requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Ignore major version updates (may have breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The plugin's optional runtime dependencies (scripts/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/scripts"
    target-branch: "main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"

name: CI

on:
  push:
    branches: [ main, develop, rc/** ]
  pull_request:
    branches: [ main, develop, rc/** ]

permissions: {}

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The plugin runs on the user's own Python, so every supported version is tested.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov lxml defusedxml lizard radon cognitive-complexity

      - name: Run unit tests
        run: |
          pytest --cov=scripts --cov=tools \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  plugin-validate:
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Local manifest checks only: no model calls and no API key.
      - name: Validate plugin and marketplace manifests
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json
          claude plugin validate --strict .

  security-scan:
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Python dependency vulnerability scanning (runtime extras and contributor tooling)
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r scripts/requirements.txt --desc on
          pip-audit -r requirements-dev.txt --desc on

      # Python SAST with Bandit (medium and high severity fail the job)
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r scripts/ tools/ tests/ -ll -f json -o bandit-report.json

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

      # Secret scanning with Gitleaks
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml

  sbom:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Python SBOM (CycloneDX format) for the plugin's optional runtime dependencies
      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom

      - name: Generate Python SBOM
        run: cyclonedx-py requirements scripts/requirements.txt -o sbom-python.json --output-format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: sbom-python.json
        if: always()

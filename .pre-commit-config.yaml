# Pre-commit hooks for code quality
# See https://pre-commit.com for more information

# Pin Python hooks to 3.11. Without this, pre-commit picks whichever `python3` it finds first on
# PATH, which on macOS is often the system 3.9, and several hooks need 3.10+ to run.
# The plugin scripts themselves stay compatible with Python 3.9 (CI tests 3.9 to 3.13).
default_language_version:
  python: python3.11

repos:
  # General file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=250']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: mixed-line-ending

  # Python code formatting with Black (line length set in pyproject.toml)
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3.11

  # Import sorting (profile set in pyproject.toml)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # Python linting with flake8 (settings in .flake8)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  # Type checking with mypy (settings in mypy.ini)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy

  # Python security scanning with Bandit.
  # Fails on MEDIUM and HIGH severity issues (-ll). No checks are skipped and no files are excluded.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-ll']

  # Secret scanning with detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Enhanced secret scanning with Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        args: ['--config', 'gitleaks.toml']

  - repo: local
    hooks:
      # Code complexity gate: fails if any file is rated bad for cyclomatic complexity,
      # cognitive complexity or maintainability index.
      - id: code-metrics
        name: code-metrics
        entry: python tools/quality/code_metrics.py --fail-on-bad
        language: python
        pass_filenames: false
        additional_dependencies:
          - lizard
          - radon
          - cognitive-complexity

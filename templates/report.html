<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Athetize report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234A7490' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z'/%3E%3Cpath d='M14 3v5h5'/%3E%3Cpath d='M9 14.5l2.2 2.2L15.5 12'/%3E%3C/svg%3E">
<style>
/* Layout: a brand row, a title band, a sticky row of result filters, then the paper on a
   single aligned column with the source list under it. Claim details open in a card on
   desktop and in a bottom sheet on touch screens. Everything is in this one file. */
:root{
  /* type: the named fonts are used when installed; nothing is downloaded */
  --font-body:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-heading:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono",Menlo,Monaco,Consolas,monospace;
  /* brand and neutrals */
  --primary:#5B8FA8; --primary-dark:#4A7490; --link:#3E6D88; --accent:#475569; --on-accent:#FFFFFF;
  --ink:#2C3E50; --muted:#5F6C6A; --faint:#8C9A97;
  --line:#D1D9D7; --line-light:#E8ECEB; --bg:#FAFBFC; --surface:#FFFFFF; --soft:#F4F6F7;
  --hover:rgba(91,143,168,.08); --note-bg:#FDFBEA; --note-line:#EAE3B4;
  /* results */
  --ok:#0B7A53; --part:#946000; --bad:#C0302B; --unv:#5F6C7B; --unc:#4A7490;
  --shadow:0 4px 14px rgba(44,62,80,.12);
  --col:900px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#7AA8BE; --primary-dark:#9CC3D6; --link:#9CC3D6; --accent:#CBD5E1; --on-accent:#17212B;
    --ink:#E4EAED; --muted:#A7B3B8; --faint:#7F8D93;
    --line:#33414D; --line-light:#28343F; --bg:#11181F; --surface:#18222B; --soft:#1F2B35;
    --hover:rgba(122,168,190,.12); --note-bg:#25241A; --note-line:#4B4629;
    --ok:#4FD1A1; --part:#F0B94B; --bad:#FF8078; --unv:#9DABBB; --unc:#9CC3D6;
    --shadow:0 6px 20px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#7AA8BE; --primary-dark:#9CC3D6; --link:#9CC3D6; --accent:#CBD5E1; --on-accent:#17212B;
  --ink:#E4EAED; --muted:#A7B3B8; --faint:#7F8D93;
  --line:#33414D; --line-light:#28343F; --bg:#11181F; --surface:#18222B; --soft:#1F2B35;
  --hover:rgba(122,168,190,.12); --note-bg:#25241A; --note-line:#4B4629;
  --ok:#4FD1A1; --part:#F0B94B; --bad:#FF8078; --unv:#9DABBB; --unc:#9CC3D6;
  --shadow:0 6px 20px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;position:relative}
button{font:inherit;color:inherit}
a{color:var(--link)}
a:hover{color:var(--primary-dark)}
h1,h2,h3{font-family:var(--font-heading);font-weight:600}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.in{max-width:var(--col);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- brand row ---------- */
.top{background:var(--surface);padding-top:env(safe-area-inset-top,0px)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:9px;color:var(--primary-dark)}
/* the mark is drawn 18px tall inside its 24px box; 26px type has capitals of the same height */
.brand svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font:600 26px/1 var(--font-heading);letter-spacing:-.01em}
.brand-sub{font-weight:400}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* ---------- page tabs ---------- */
/* Tabs are boxes on a rule: the page you are on is filled and joined to the content below. */
.pagetabs{background:var(--surface)}
.tabstrip{display:flex;gap:6px;align-items:flex-end;border-bottom:2px solid var(--primary-dark)}
.ptab{display:inline-flex;align-items:center;gap:8px;min-width:132px;justify-content:center;height:42px;padding:0 22px;cursor:pointer;
  border:1px solid var(--line);border-bottom:0;background:var(--bg);color:var(--ink);font:600 15px/1 var(--font-heading)}
.ptab:hover{background:var(--hover)}
.ptab[aria-current="page"]{background:var(--primary-dark);border-color:var(--primary-dark);color:var(--on-accent)}
.ptab .n{font-weight:400;opacity:.8}
.textbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px/1 var(--font-heading);cursor:pointer}
.textbtn:hover{background:var(--hover);color:var(--ink)}
a.textbtn{text-decoration:none}
.textbtn .n{font-weight:400;color:var(--muted)}
.textbtn{white-space:nowrap}
[hidden]{display:none!important}

/* ---------- title band ---------- */
.hero{background:var(--surface);padding:6px 0 18px}
.summary{background:var(--surface);padding:18px 0 6px}
.hero h1{font-size:clamp(22px,3.4vw,30px);line-height:1.25;margin:0;text-wrap:balance}
.bar{display:flex;height:6px;background:var(--line-light);margin:0;gap:2px}
.bar button{border:0;padding:0;cursor:pointer;background:var(--c);min-width:6px;transition:flex-grow .4s}
.bar button:hover{filter:brightness(1.12)}

/* ---------- sticky filter row ---------- */
.tabs{position:sticky;top:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-light);border-bottom:1px solid var(--line)}
.tabs .in{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px}
.summary .chips{flex-wrap:wrap;overflow:visible;margin-top:8px}
.summary .chip{padding:6px 10px 5px}
.chips{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;margin-left:-10px}
.chips::-webkit-scrollbar{display:none}
.chip{--c:var(--unv);display:inline-flex;align-items:center;gap:7px;border:0;border-bottom:3px solid transparent;background:none;padding:13px 10px 10px;cursor:pointer;white-space:nowrap;font:400 14px/1.4 var(--font-heading);color:var(--muted)}
.chip::before{content:"";width:9px;height:9px;background:var(--c);flex:none}
.chip b{font-weight:600;color:var(--ink)}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip[aria-pressed="true"]{border-bottom-color:var(--c);color:var(--ink);font-weight:600}
.g-ok{--c:var(--ok)} .g-part{--c:var(--part)} .g-bad{--c:var(--bad)} .g-unv{--c:var(--unv)} .g-unc{--c:var(--unc)}
.nav{display:flex;align-items:center;gap:6px;flex:none}
.nav button{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav span{font-size:13px;color:var(--muted);min-width:92px;text-align:center;white-space:nowrap}

/* ---------- page ---------- */
.wrap{padding-top:24px;padding-bottom:28px}
.foot{padding:0 0 88px;font-size:12px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.notice{margin:0 0 20px;padding:14px 18px;border:1px solid var(--note-line);background:var(--note-bg);font-size:14px}
.notice b{font-family:var(--font-heading);font-weight:600}
.notice.need{border-color:var(--part)}
.notice.need .act{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice.need .act a,.notice.need .act button{font:400 12.5px/1.6 var(--font-body);padding:3px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.notice.need .act a:hover,.notice.need .act button:hover{background:var(--hover)}
.sheet{background:var(--surface);border:1px solid var(--line);padding:clamp(20px,6vw,60px)}
.sheet h2.h{font-size:1.15rem;line-height:1.35;margin:1.9em 0 .6em}
.sheet h2.h:first-child{margin-top:0}
.para{font-size:1.03rem;line-height:1.8;margin:0 0 1.1em;overflow-wrap:anywhere}
.para:last-child{margin-bottom:0}

/* ---------- claim overlay: colour plus a line style, so it reads without colour ---------- */
.claim{--c:var(--unv);cursor:pointer;padding:1px 0;background:color-mix(in srgb,var(--c) 11%,transparent);border-bottom:2px solid var(--c);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s,opacity .2s}
.claim:hover,.claim.active{background:color-mix(in srgb,var(--c) 24%,transparent)}
.claim.dim{opacity:.3}
.claim.has-bad{border-bottom-color:var(--bad)}
/* judged from an abstract only: striped, because only part of the source was read */
.claim.prov{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,transparent) 0 4px,transparent 4px 8px)}
.claim.prov:hover,.claim.prov.active{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,transparent) 0 4px,color-mix(in srgb,var(--c) 10%,transparent) 4px 8px)}
.bar button.prov{background:repeating-linear-gradient(135deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 30%,var(--surface)) 3px 6px)}
.chip.g-prov{--c:var(--muted)}
.chip.g-prov::before{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 4px);outline:1px solid var(--muted)}
.provline{margin:6px 0 2px;font-size:13px;color:var(--muted)}
.provnote{margin:0 0 12px;padding:8px 12px;font-size:13.5px;border:1px solid var(--note-line);background:var(--note-bg)}
.failnote{margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--bad)}
.v-supported{--c:var(--ok)}
.v-partially_supported,.v-overstated{--c:var(--part);border-bottom-style:dashed}
.v-unsupported,.v-contradicted{--c:var(--bad);border-bottom-style:double;border-bottom-width:4px}
.v-unverifiable,.v-pending{--c:var(--unv);border-bottom-style:dotted}
.v-uncited{--c:var(--unc);border-bottom-style:dotted;background:none}
.v-uncited:hover,.v-uncited.active{background:color-mix(in srgb,var(--c) 14%,transparent)}
.v-note{--c:var(--unc);border-bottom-style:dotted;background:color-mix(in srgb,var(--c) 7%,transparent)}
.pnote{margin-left:8px;border:1px solid var(--unc);color:var(--unc);background:transparent;padding:0 8px;font:600 11.5px/1.7 var(--font-body);cursor:pointer;vertical-align:.1em}
.pnote:hover{background:var(--hover)}

/* ---------- position rail ---------- */
.rail{position:fixed;right:max(6px,env(safe-area-inset-right,0px));top:64px;bottom:24px;width:8px;z-index:15;pointer-events:none}
.rail a{position:absolute;left:0;width:8px;height:3px;background:var(--c);pointer-events:auto;opacity:.85}
.rail a:hover{height:7px;margin-top:-2px;opacity:1}
@media (max-width:980px){.rail{display:none}}

/* ---------- claim card ---------- */
.card{position:absolute;z-index:40;width:min(460px,calc(100vw - 24px));max-height:min(70vh,540px);overflow:auto;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);box-shadow:var(--shadow);padding:0;visibility:hidden;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s,visibility 0s .14s}
.card.open{visibility:visible;opacity:1;transform:none;transition:opacity .14s,transform .14s}
.card.as-sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:76vh;border-width:1px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
.card.as-sheet.open{transform:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.card .grab{display:none;width:40px;height:3px;background:var(--line);margin:8px auto 0}
.card.as-sheet .grab{display:block}
.c-head{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line-light);z-index:1}
.badge{--c:var(--unv);font:600 13px/1.5 var(--font-heading);color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));border-left:3px solid var(--c);padding:3px 10px}
.c-head .sp{flex:1}
.c-head button{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.c-head button:hover{background:var(--hover);color:var(--ink)}
.c-body{padding:14px 16px 16px}
.claimtxt{margin:0 0 12px;font-size:14px;line-height:1.6;font-style:italic;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.blk{border:1px solid var(--line-light);padding:12px 14px;margin-top:10px;background:var(--bg)}
.blk .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.pill{--c:var(--unv);display:inline-block;font:600 11.5px/1.6 var(--font-body);padding:0 8px;border:1px solid var(--c);color:var(--c);white-space:nowrap}
.pill.solid{background:var(--c);color:var(--surface)}
.conf{font-size:12px;color:var(--muted)}
.an{margin:0 0 10px;font-size:14px;line-height:1.6}
.ev{margin:0 0 10px;padding:10px 12px;background:color-mix(in srgb,var(--c,var(--ok)) 8%,var(--surface));border-left:3px solid var(--c,var(--ok))}
.ev figcaption{font:600 11px/1.5 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ev figcaption a{letter-spacing:0;text-transform:none}
.ev blockquote.exq{margin:0;font-size:14px;line-height:1.65;max-height:16em;overflow:auto}
.ev blockquote.exq .ctx{color:var(--muted)}
.ev blockquote.exq mark{background:color-mix(in srgb,var(--c) 24%,transparent);color:inherit;padding:0 .1em}
.src{font-size:13px;color:var(--muted);line-height:1.55}
.src a{font-weight:600;overflow-wrap:anywhere}
.src .cite{font-weight:600;color:var(--ink)}
.src .rawref{margin-top:3px;font-size:12.5px}
.srch{margin-top:4px;font-size:12.5px}
.srch a{font-weight:400}
.src .row2{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.help{margin-top:8px;font-size:12.5px;color:var(--muted)}
.help code{font:12px var(--font-mono);background:var(--surface);border:1px solid var(--line);padding:0 5px}
.sugs h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.sug{border:1px solid var(--line);border-left:3px solid var(--primary);padding:10px 12px;margin-top:8px;background:var(--surface)}
.sug.off{opacity:.55}
.sug .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.sug .diff{font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.sug .diff del{color:var(--bad);text-decoration:line-through;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.sug .diff ins{color:var(--ok);text-decoration:none;background:color-mix(in srgb,var(--ok) 13%,transparent);border-bottom:1px solid var(--ok)}
.sug .why{font-size:13px;margin:6px 0 0;color:var(--muted)}
.sug .act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sug .act button,.sugsum button,.addsrc .act button{font:400 12.5px/1.6 var(--font-body);padding:3px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sug .act button:hover,.sugsum button:hover,.addsrc .act button:hover{background:var(--hover)}
.sug .act button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.sugsum{margin:18px 0 0;font-size:13.5px;color:var(--muted)}
.sugsum button{margin-left:8px}

/* ---------- sources page ---------- */
.srchead .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin:0 0 16px}
.textbtn.primary{background:var(--primary-dark);border-color:var(--primary-dark);color:var(--on-accent)}
.textbtn.primary:hover{background:var(--primary-dark);filter:brightness(1.1)}
.srchead p{margin:0;font-size:14px;color:var(--muted);flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.addsrc{background:var(--surface);border:1px solid var(--line);padding:18px 20px;margin:0 0 26px}
.addsrc h2{font-size:1.1rem;margin:0 0 6px}
.addsrc p{margin:0 0 14px;font-size:14px}
.addsrc ul{margin:0 0 14px;padding-left:20px;font-size:14px}
.addsrc li{margin:2px 0;overflow-wrap:anywhere}
.addsrc .req{font:12.5px/1.5 var(--font-mono);background:var(--bg);border:1px solid var(--line-light);padding:8px 10px;margin:0 0 12px;color:var(--ink);overflow-wrap:anywhere}
.addsrc .act{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.addsrc .after{margin:0;font-size:13px;color:var(--muted)}
.addsrc > :last-child{margin-bottom:0}
#sourcesView.dropping{outline:2px dashed var(--primary);outline-offset:-6px}
.textbtn:disabled{opacity:.55;cursor:default}
.addwrap{position:relative;flex:none}
.addmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:170px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.14)}
.addmenu button{border:0;background:none;text-align:left;padding:10px 14px;font:14px/1.3 var(--font-body);color:var(--ink);cursor:pointer}
.addmenu button:hover,.addmenu button:focus-visible{background:var(--hover)}
.srcfilter{border-bottom:1px solid var(--line);margin:0 0 14px}
.srcfilter .chip{--c:var(--primary)}
.srcfilter .chip::before{display:none}
.srow{background:var(--surface);border:1px solid var(--line);padding:14px 18px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.srow .id{font:600 12.5px/1.8 var(--font-mono);color:var(--muted)}
.srow .cit{font-size:14.5px;overflow-wrap:anywhere}
.srow .pills{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px;grid-column:2}
.srow .used{grid-column:2;font-size:12.5px;color:var(--muted);margin-top:4px}
.cchip{display:inline-block;margin:0 6px 4px 0;padding:0 7px;font:600 12px/1.75 var(--font-mono);color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);text-decoration:none}
.cchip:hover{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.g-ref{--c:var(--primary-dark)}
.difflist{margin:0 0 10px;padding-left:18px;font-size:13.5px}
.srow .more{grid-column:2;font-size:12px;color:var(--muted)}
.srow .why{grid-column:2;font-size:12.5px;color:var(--muted)}
.srow.flag{border-left:3px solid var(--part)}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* ---------- phones ---------- */
@media (max-width:760px){
  .brand-name{font-size:19px}
  .brand svg{width:18px;height:18px}
  .chip{padding:13px 10px 10px;font-size:13.5px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:35;justify-content:center;gap:10px;background:var(--surface);border-top:1px solid var(--line);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
  .nav button{width:44px;height:40px}
  body.sheet-open .nav{display:none}
  .tabs{position:static}
  .tabs .in{min-height:0;justify-content:flex-end;padding-top:8px;padding-bottom:8px}
  .ptab{flex:1;min-width:0;padding:0 10px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card,.card.as-sheet,.claim,.bar button{transition:none}}
@media print{.tabs,.nav,.rail,.card,.iconbtn,.hint,.pagetabs,.addsrc{display:none!important}body{background:#fff}.sheet{border:0;padding:0}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14.5l2.2 2.2L15.5 12"/></svg>
      <span class="brand-name">Athetize <span class="brand-sub">Fact Checker</span></span>
    </div>
    <button class="iconbtn" id="theme" type="button" aria-label="Toggle light and dark theme" title="Toggle theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>

<section class="hero">
  <div class="in">
    <h1 id="title"></h1>
  </div>
</section>

<nav class="pagetabs" aria-label="Report pages">
  <div class="in"><div class="tabstrip">
    <button class="ptab" id="openResults" type="button" aria-current="page">Results</button>
    <button class="ptab" id="openSources" type="button">Sources <span class="n" id="srcCount"></span></button>
  </div></div>
</nav>

<section class="summary" id="summary">
  <div class="in">
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="chips" id="chips" role="group" aria-label="Filter claims by result"></div>
    <p class="provline" id="provLine" hidden></p>
  </div>
</section>

<div class="tabs">
  <div class="in">
    <div class="nav" id="nav"><button type="button" id="prev" aria-label="Previous claim needing attention"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><span id="navLabel"></span><button type="button" id="next" aria-label="Next claim needing attention"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <a class="textbtn primary" id="wordReport" hidden title="Download the Word copy with the suggested edits as tracked changes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Word report</span></a>
  </div>
</div>

<main class="wrap in" id="docView">
  <p class="hint">Hover a highlight, or tap it on a phone, to see the analysis and the source.</p>
  <div class="notice need" id="needSrc" hidden></div>
  <article class="sheet" id="paper"></article>
  <div class="sugsum" id="sugSum"></div>
</main>

<main class="wrap in" id="sourcesView" hidden>
  <h2 class="vh">Sources</h2>
  <div class="srchead">
    <div class="row"><p id="srcLead"></p><div class="addwrap"><button class="textbtn primary" id="addSources" type="button">Add sources</button><div class="addmenu" id="addMenu" role="menu" hidden><button type="button" role="menuitem" id="pickFiles">Files…</button><button type="button" role="menuitem" id="pickFolder">A folder…</button></div></div></div>
    <input type="file" id="srcPicker" multiple hidden accept=".pdf,.txt,.md,.html,.htm,.docx,.xml">
    <input type="file" id="dirPicker" webkitdirectory hidden>
  </div>
  <section class="addsrc" id="addSrc" aria-live="polite" hidden></section>
  <div class="srcfilter"><div class="chips" id="srcFilter" role="group" aria-label="Filter sources"></div></div>
  <div id="srcList"></div>
</main>

<footer class="foot"><div class="in" id="foot"></div></footer>

<div class="rail" id="rail" aria-hidden="true"></div>
<div class="card" id="card" role="dialog" aria-label="Claim analysis" tabindex="-1"></div>

<script>
(function(){
'use strict';
var DATA = /*__ATHETIZE_DATA__*/null;
if(!DATA){document.body.textContent='No report data found.';return;}

var LABEL={supported:'Supported',partially_supported:'Partly supported',overstated:'Overstated',unsupported:'Not supported',contradicted:'Contradicted',unverifiable:"Can't verify",pending:'Not checked yet',uncited:'Needs a citation',note:'Note'};
var GROUP={supported:'ok',partially_supported:'part',overstated:'part',unsupported:'bad',contradicted:'bad',unverifiable:'unv',pending:'unv',uncited:'unc',note:'unc'};
var GLABEL={ok:'Supported',part:'Partial',bad:'Not supported',unv:"Can't verify",unc:'Uncited and notes'};
var FAILING_NOTE='A cited source does not support this';
var PROV_LABEL='from the abstract only';
var GVAR={ok:'--ok',part:'--part',bad:'--bad',unv:'--unv',unc:'--unc'};
var STATUS={full_text:'Full text',abstract_only:'Abstract only',user_provided:'Provided by you',missing:'No full text found',unresolved:'Not looked up'};
var DATABASE={crossref:'Crossref',openalex:'OpenAlex'};
var EXISTS={verified:'Found in a citation database',partial_match:'Database record differs in part',mismatch:'Database record does not match',not_found:'Not found in citation databases',unchecked:'Not looked up'};
var EXISTS_MEANS={verified:'A record matching this reference was found, so the work exists as cited.',partial_match:'The closest record differs from the reference in part, so it was not relied on.',mismatch:'The record behind the printed DOI is a different work.',not_found:'No record of this work was found in Crossref or OpenAlex.'};
function existsPill(r){
  var text=r.exists==='verified'&&DATABASE[r.matched_source]?'Found in '+DATABASE[r.matched_source]:(EXISTS[r.exists]||r.exists);
  var p=pill(text,r.exists==='verified'?'var(--ok)':'var(--part)');if(EXISTS_MEANS[r.exists])p.title=EXISTS_MEANS[r.exists];return p;
}
function whyLine(reasons,cls){return el('div',cls,'Why there is no full text: '+reasons.join('; ')+'.');}

function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function safeUrl(u){if(!u)return null;try{var x=new URL(u,location.href);return(x.protocol==='https:'||x.protocol==='http:')?x.href:null;}catch(e){return null;}}
function localHref(p){if(location.protocol!=='file:')return null;return(p&&/^sources\//.test(p)&&p.indexOf('..')<0)?encodeURI(p):null;}
var SVGNS='http://www.w3.org/2000/svg';
var ICONS={prev:'M15 6l-6 6 6 6',next:'M9 6l6 6-6 6',close:'M6 6l12 12M18 6L6 18'};
function icon(name){var s=document.createElementNS(SVGNS,'svg');s.setAttribute('class','ic');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');
  var p=document.createElementNS(SVGNS,'path');p.setAttribute('d',ICONS[name]);s.appendChild(p);return s;}
function iconBtn(name,label){var b=el('button');b.type='button';b.title=label;b.setAttribute('aria-label',label);b.append(icon(name));return b;}

document.title=(DATA.meta.title||'Report')+' · Athetize Fact Checker';
$('#title').textContent=DATA.meta.title||'Untitled paper';
$('#foot').textContent='Checked '+DATA.meta.generated+(DATA.meta.source_file?' \u00b7 '+DATA.meta.source_file:'')+' \u00b7 Athetize '+DATA.meta.version;

/* ---------- build the item list ---------- */
var items=[]; // {kind,d,verdict,group,el}
var byPara={}, pnotes={};
DATA.claims.forEach(function(c){(byPara[c.para]=byPara[c.para]||[]).push({kind:'claim',d:c,start:c.start,end:c.end});});
DATA.notes.forEach(function(n){
  if(n.start!=null){(byPara[n.para]=byPara[n.para]||[]).push({kind:'note',d:n,start:n.start,end:n.end});}
  else{(pnotes[n.para]=pnotes[n.para]||[]).push(n);}
});

var paper=$('#paper');
var lastText=-1;DATA.paragraphs.forEach(function(p,pi){if(p.kind!=='heading')lastText=pi;});
DATA.paragraphs.forEach(function(p,pi){
  if(pi===0&&p.text===DATA.meta.title)return;
  if(p.kind==='heading'){
    if(pi>lastText)return;
    paper.append(el('h2','h',p.text));return;
  }
  var node=el('p','para');node.id='para-'+p.id;
  var segs=(byPara[p.id]||[]).sort(function(a,b){return a.start-b.start||(a.kind==='claim'?-1:1);});
  var pos=0;
  segs.forEach(function(s){
    if(s.start<pos){ if(s.kind==='note'){(pnotes[p.id]=pnotes[p.id]||[]).push(s.d);} return; }
    if(s.start>pos)node.append(document.createTextNode(p.text.slice(pos,s.start)));
    var verdict=s.kind==='claim'?s.d.verdict:'note';
    var failing=s.kind==='claim'&&GROUP[verdict]!=='bad'&&(s.d.failing_refs||[]).length>0;
    var prov=s.kind==='claim'&&s.d.provisional===true;
    var m=el('span','claim v-'+verdict+(failing?' has-bad':'')+(prov?' prov':''),p.text.slice(s.start,s.end));
    m.tabIndex=0;m.setAttribute('role','button');
    m.setAttribute('aria-label',LABEL[verdict]+(prov?', '+PROV_LABEL+', provisional':'')+(failing?', and '+FAILING_NOTE.toLowerCase():'')+': '+p.text.slice(s.start,s.end));
    var idx=items.length;
    m.dataset.idx=idx;
    items.push({kind:s.kind,d:s.d,verdict:verdict,group:GROUP[verdict],failing:failing,prov:prov,el:m});
    node.append(m);pos=s.end;
  });
  if(pos<p.text.length)node.append(document.createTextNode(p.text.slice(pos)));
  (pnotes[p.id]||[]).forEach(function(n){
    var b=el('button','pnote','Note');b.type='button';
    var idx=items.length;b.dataset.idx=idx;
    items.push({kind:'note',d:n,verdict:'note',group:'unc',el:b});
    node.append(b);
  });
  paper.append(node);
});
if(!DATA.claims.length&&!DATA.notes.length){paper.append(el('div','empty','No checkable claims were found in this paper.'));}

/* ---------- filters + summary bar ---------- */
/* A claim sits in one group, by its best source. A claim that also has a cited source which
   does not support it is counted and filtered under "Not supported" as well, so that
   finding is never hidden behind a better result from another source. */
var active={};
var counts={ok:0,part:0,bad:0,unv:0,unc:0};
items.forEach(function(it){counts[it.group]++;});
function inGroup(it,g){return it.group===g||(g==='bad'&&it.failing)||(g==='prov'&&it.prov);}
function shown(it){return Object.keys(active).some(function(g){return active[g]&&inGroup(it,g);});}
var alsoFailing=items.filter(function(it){return it.failing;}).length;
var chips=$('#chips'), bar=$('#bar');
Object.keys(GLABEL).forEach(function(g){
  var b=el('button','chip g-'+g);b.type='button';b.setAttribute('aria-pressed','false');b.dataset.g=g;
  var n=counts[g]+(g==='bad'?alsoFailing:0);
  b.append(document.createTextNode(GLABEL[g]+' '));b.append(el('b',null,String(n)));
  if(g==='bad'&&alsoFailing)b.title='Includes '+alsoFailing+(alsoFailing===1?' claim that another source supports in part, but one':' claims that another source supports in part, but one')+' cited source does not support';
  b.addEventListener('click',function(){active[g]=!active[g];applyFilter();});
  chips.append(b);
  /* The bar shows each group in two parts: read in full (solid), and judged from an
     abstract only (striped), which is provisional. */
  var part=items.filter(function(it){return it.group===g&&it.prov;}).length;
  [[counts[g]-part,''],[part,' prov']].forEach(function(x){
    if(!x[0])return;
    var s=el('button','g-'+g+x[1]);s.type='button';s.style.flexGrow=x[0];
    s.title=GLABEL[g]+(x[1]?', '+PROV_LABEL:'')+': '+x[0];
    if(!x[1])s.style.background='var('+GVAR[g]+')';
    s.addEventListener('click',function(){active[x[1]?'prov':g]=!active[x[1]?'prov':g];applyFilter();});
    bar.append(s);
  });
});
var provCount=items.filter(function(it){return it.prov;}).length;
var judgedCount=items.filter(function(it){return it.group==='ok'||it.group==='part'||it.group==='bad';}).length;
if(provCount){
  var pc=el('button','chip g-prov');pc.type='button';pc.setAttribute('aria-pressed','false');pc.dataset.g='prov';
  pc.append(document.createTextNode('Abstract only '));pc.append(el('b',null,String(provCount)));
  pc.title='Results judged from an abstract only. They are provisional.';
  pc.addEventListener('click',function(){active.prov=!active.prov;applyFilter();});
  chips.append(pc);
  var pl=$('#provLine');pl.hidden=false;
  pl.textContent=provCount+' of '+count(judgedCount,'result rests','results rest')+' on an abstract only (striped). '+(provCount===1?'It is':'They are')+' provisional: the full text is what settles '+(provCount===1?'it.':'them.');
}
bar.removeAttribute('aria-hidden');
function anyActive(){return Object.keys(active).some(function(k){return active[k];});}
function applyFilter(){
  var any=anyActive();
  items.forEach(function(it){it.el.classList.toggle('dim',any&&!shown(it));});
  [].forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',active[c.dataset.g]?'true':'false');});
  updateNav();placeRail();
}

/* ---------- navigation list ---------- */
function navList(){
  var any=anyActive(),out=[];
  items.forEach(function(it,i){
    if(any){if(shown(it))out.push(i);}
    else if(it.verdict!=='supported')out.push(i);
  });
  return out;
}
var cur=-1;
function updateNav(){
  var l=navList(),pos=l.indexOf(cur);
  /* before anything is picked it reads 1: the next press goes to the first one */
  $('#navLabel').textContent=l.length?((pos>=0?pos+1:1)+' of '+l.length+(anyActive()?' shown':' to review')):'nothing to review';
}
function go(delta){
  var l=navList();if(!l.length)return;
  var pos=l.indexOf(cur);
  var next=pos<0?(delta>0?0:l.length-1):(pos+delta+l.length)%l.length;
  focusItem(l[next],true);
}
function focusItem(i,scroll){
  if(cur>=0&&items[cur])items[cur].el.classList.remove('active');
  cur=i;var it=items[i];it.el.classList.add('active');
  if(scroll)it.el.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  openCard(i,true,false);updateNav();
}
$('#prev').addEventListener('click',function(){go(-1);});
$('#next').addEventListener('click',function(){go(1);});

/* ---------- card ---------- */
var card=$('#card'), pinned=false, showT=null, hideT=null, openIdx=-1, lastPointer={x:0,y:0};
function sheetMode(){return window.matchMedia('(max-width: 760px), (hover: none)').matches;}

function searchLinks(sr){var d=el('div','srch');d.append(document.createTextNode('No link in the reference. Find it: '));
  [['Google Scholar',sr.scholar],['WorldCat',sr.worldcat]].forEach(function(x,i){var u=safeUrl(x[1]);if(!u)return;if(i)d.append(document.createTextNode(' \u00b7 '));var a=el('a',null,x[0]);a.href=u;a.target='_blank';a.rel='noopener noreferrer';d.append(a);});return d;}
var SUG={};(DATA.suggestions||[]).forEach(function(x){SUG[x.id]=x;});
var EXKEY='athetize-excluded-'+(DATA.meta.source_file||'paper'), EXCL={};
try{(JSON.parse(localStorage.getItem(EXKEY)||'[]')||[]).forEach(function(k){EXCL[k]=1;});}catch(e){}
function saveExcl(){try{localStorage.setItem(EXKEY,JSON.stringify(Object.keys(EXCL)));}catch(e){}renderSugSum();}
function copyText(t,btn){var done=function(){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1200);};
  try{navigator.clipboard.writeText(t).then(done,function(){btn.textContent='Copy failed';});}catch(e){btn.textContent='Copy failed';}}
function sugBlock(sg){
  var b=el('div','sug'+(EXCL[sg.id]?' off':''));
  var row=el('div','row');
  row.append(pill(sg.kind==='rewrite'?'Suggested rewording':(sg.kind==='reference'?'Reference list fix':'Citation fix'),'var(--muted)'));
  row.append(el('span',null,sg.id+' \u00b7 '+sg.where+(sg.refs&&sg.refs.length?' \u00b7 ['+sg.refs.join('], [')+']':'')));
  b.append(row);
  var d=el('div','diff');
  if(!sg.suggested){d.append(el('del',null,sg.original));d.append(el('span',null,' (delete)'));}
  else sg.diff.forEach(function(op){d.append(op[0]==='='?document.createTextNode(op[1]):el(op[0]==='-'?'del':'ins',null,op[1]));});
  b.append(d);
  if(sg.rationale)b.append(el('p','why',sg.rationale));
  var act=el('div','act');
  if(sg.suggested){var cp=el('button',null,'Copy new text');cp.type='button';cp.addEventListener('click',function(){copyText(sg.suggested,cp);});act.append(cp);}
  var tg=el('button',null,EXCL[sg.id]?'Excluded from Word export':'Included in Word export');tg.type='button';tg.setAttribute('aria-pressed',EXCL[sg.id]?'false':'true');
  tg.addEventListener('click',function(){if(EXCL[sg.id])delete EXCL[sg.id];else EXCL[sg.id]=1;var off=!!EXCL[sg.id];
    b.classList.toggle('off',off);tg.textContent=off?'Excluded from Word export':'Included in Word export';tg.setAttribute('aria-pressed',off?'false':'true');saveExcl();});
  act.append(tg);b.append(act);
  return b;
}
function renderSugSum(){var box=document.getElementById('sugSum');if(!box)return;box.textContent='';
  var all=DATA.suggestions||[];if(!all.length)return;
  var ex=all.filter(function(x){return EXCL[x.id];}).map(function(x){return x.id;});
  box.append(document.createTextNode(all.length+(all.length===1?' suggested edit (':' suggested edits (')+(all.length-ex.length)+' included in the Word export). Ask Claude to export them to Word as tracked changes'+(ex.length?', excluding: '+ex.join(', '):'')+'.'));
  if(ex.length){var c=el('button',null,'Copy exclusion list');c.type='button';c.addEventListener('click',function(){copyText('Export suggestions to Word, excluding '+ex.join(', '),c);});box.append(c);}
}
function pill(text,color,solid){var p=el('span','pill'+(solid?' solid':''),text);p.style.setProperty('--c',color);return p;}
function colorFor(v){return 'var('+GVAR[GROUP[v]||'unv']+')';}

function refBlock(r,multi){
  var b=el('div','blk');
  var row=el('div','row');
  if(multi){var vp=pill(LABEL[r.verdict],colorFor(r.verdict),true);row.append(vp);}
  row.append(pill('['+r.ref_id+']','var(--muted)'));
  if(r.confidence!=null&&r.verdict!=='pending'&&!(r.flags&&r.flags.indexOf('no_source')>=0))row.append(el('span','conf',Math.round(r.confidence*100)+'% confidence'));
  b.append(row);
  if(r.analysis)b.append(el('p','an',r.analysis));
  var exs=(r.excerpts&&r.excerpts.length)?r.excerpts:(r.quote?[{before:'',match:r.quote,after:'',page:r.page,mode:r.match}]:[]);
  exs.forEach(function(x,k){
    var fig=el('figure','ev');fig.style.margin='0 0 8px';fig.style.setProperty('--c',colorFor(r.verdict));
    var cap=[exs.length>1?('Evidence '+(k+1)+' of '+exs.length):'Evidence in source'];
    if(x.page)cap.push('p. '+x.page);
    cap.push(r.evidence_level==='abstract'?'abstract only':'full text');
    if(x.mode&&x.mode!=='exact')cap.push('near-exact match');
    var fc=el('figcaption',null,cap.join(' \u00b7 '));
    var lhp=localHref(r.local_file);
    if(lhp){var pa=el('a',null,x.page?'Open at p. '+x.page:'Open source');
      pa.href=lhp+(x.page&&/\.pdf$/i.test(r.local_file||'')?'#page='+x.page:'');pa.target='_blank';pa.rel='noopener';
      fc.append(document.createTextNode(' \u00b7 '));fc.append(pa);}
    fig.append(fc);
    var q=el('blockquote','exq');
    if(x.before)q.append(el('span','ctx',x.before+' '));
    q.append(el('mark',null,x.match));
    if(x.after)q.append(el('span','ctx',' '+x.after));
    fig.append(q);
    b.append(fig);
  });
  var src=el('div','src');
  var url=safeUrl(r.link);
  if(url){var a=el('a',null,r.citation);a.href=url;a.target='_blank';a.rel='noopener noreferrer';src.append(a);}
  else src.append(el('span','cite',r.citation));
  if(r.raw&&r.raw!==r.citation)src.append(el('div','rawref',r.raw));
  if(!url&&r.search)src.append(searchLinks(r.search));
  var row2=el('div','row2');
  if(r.retracted)row2.append(pill('Retracted or corrected','var(--bad)',true));
  if(r.exists&&r.exists!=='verified'&&r.exists!=='unchecked')row2.append(pill(EXISTS[r.exists]||r.exists,'var(--part)'));
  if(r.evidence_level==='abstract')row2.append(pill('Abstract only','var(--part)'));
  if(r.evidence_level==='none')row2.append(pill('No full text found','var(--unv)'));
  var lh=localHref(r.local_file);
  if(lh){var la=el('a',null,'Open local copy');la.href=lh;la.target='_blank';la.rel='noopener';row2.append(la);}
  else if(r.local_file&&location.protocol!=='file:'){var nt=el('span',null,'Local copy available when report.html is opened from its folder');nt.style.fontSize='11.5px';nt.style.opacity='.7';row2.append(nt);}
  if(row2.children.length)src.append(row2);
  b.append(src);
  if(r.evidence_level!=='full_text'){
    var h=el('div','help');
    if(r.why_missing&&r.why_missing.length)b.append(whyLine(r.why_missing,'help'));
    h.append(document.createTextNode('Have the full text? '));
    var add=el('a',null,'Add it on the Sources page');add.href='#sources';
    add.addEventListener('click',function(ev){ev.preventDefault();openSources(null,r.ref_id);});
    h.append(add);h.append(document.createTextNode('.'));
    b.append(h);
  }
  return b;
}

function buildCard(i){
  var it=items[i],d=it.d;
  card.textContent='';
  card.append(el('div','grab'));
  var head=el('div','c-head');
  var badge=el('span','badge',LABEL[it.verdict]+(it.prov?' \u00b7 abstract only':''));badge.style.setProperty('--c',colorFor(it.verdict));
  head.append(badge);
  if(it.kind==='claim'&&d.type)head.append(pill(d.type,'var(--muted)'));
  if(it.kind==='claim'&&d.retracted)head.append(pill('Retracted source','var(--bad)',true));
  head.append(el('span','sp'));
  var onSources=!srcView.hidden;
  var pb=iconBtn('prev','Previous claim'),nb=iconBtn('next','Next claim'),cb=iconBtn('close','Close');
  pb.addEventListener('click',function(){go(-1);});nb.addEventListener('click',function(){go(1);});cb.addEventListener('click',closeCard);
  if(!onSources)head.append(pb,nb);
  head.append(cb);card.append(head);
  var body=el('div','c-body');
  if(it.kind==='claim'){
    var t=d.text.length>260?d.text.slice(0,257)+'…':d.text;
    body.append(el('div','claimtxt',t));
    if(it.prov)body.append(el('p','provnote','Judged from the abstract only. The full paper may say more, or something different, so this result is provisional until the full text is added.'));
    if(it.failing){
      var fr=d.failing_refs;
      body.append(el('p','failnote',count(fr.length,'cited source does','cited sources do')+' not support this claim: '+fr.map(function(r){return '['+r+']';}).join(', ')+'.'));
    }
    if(!d.items.length){
      body.append(el('p','an','This sentence states something specific but cites no source. Add a citation or soften the wording.'));
    }
    var multi=d.items.length>1;d.items.forEach(function(r){body.append(refBlock(r,multi));});
    if(d.note)body.append(el('p','help',d.note));
    if(d.suggestions&&d.suggestions.length){var sw=el('div','sugs');sw.append(el('h3',null,'Suggested edits'));
      d.suggestions.forEach(function(id){if(SUG[id])sw.append(sugBlock(SUG[id]));});body.append(sw);}
  }else{

function sha256(file){
  return file.arrayBuffer().then(function(buf){return crypto.subtle.digest('SHA-256',buf);}).then(function(d){
    return Array.prototype.map.call(new Uint8Array(d),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');

/* Drop files whose content repeats within the selection, or is already among the sources. */
function scanFiles(files,skip){

    if(i>=files.length){
      return api('known',{method:'POST',body:JSON.stringify({hashes:keep.map(function(k){return k.hash;})})}).then(function(j){
        return keep.filter(function(k){
          if(j.known.indexOf(k.hash)<0)return true;
          skip.known.push(k.file.name);return false;
        }).map(function(k){return k.file;});
      });
    }
    var f=files[i++];
    addNote('Adding sources',['Checking '+i+' of '+files.length+' for duplicates: '+f.name]);
    return sha256(f).then(function(h){
      if(seen[h])skip.same.push(f.name+': same content as '+seen[h]);
      else{seen[h]=f.name;keep.push({file:f,hash:h});}
      return next();
    });
  }
  return next();
}
function sendFiles(files){
  var i=0;
  if(!files.length)return {matched:[],ambiguous:[],unmatched:[],duplicates:[],already_imported:[]};
  function next(){
    if(i>=files.length){
      addNote('Adding sources',['Reading '+count(files.length,'file','files')+' and matching to the references.']);
      return api('import',{method:'POST'});
    }
    var f=files[i++];
    addNote('Adding sources',['Sending '+i+' of '+files.length+': '+f.name]);

function addFiles(list){

  var skip={other:all.length-files.length,same:[],known:[]};
  if(!files.length){addNote('Nothing to add',['None of those files is a type Athetize reads: PDF, Word, web page or text.']);return;}
  var big=files.filter(function(f){return f.size>MAX_MB*1024*1024;});
  if(big.length){addNote('Too large to add',[big.map(function(f){return f.name;}).join(', ')+' '+(big.length===1?'is':'are')+' over '+MAX_MB+' MB. Choose the other files again without '+(big.length===1?'it':'them')+'.']);return;}
  adding=true;addBtn.disabled=true;
  scanFiles(files,skip).then(sendFiles)
    .then(function(res){res.skipped=skip;markAdded(res);showAdded(res);},function(e){addNote('Could not add the files',[e.message]);})
    .then(function(){adding=false;addBtn.disabled=false;});
}
function entryFiles(entry){
  if(entry.isFile)return new Promise(function(done,fail){entry.file(function(f){done([f]);},fail);});
  if(!entry.isDirectory)return Promise.resolve([]);
  var reader=entry.createReader(),all=[];
  function more(){
    return new Promise(function(done,fail){reader.readEntries(done,fail);}).then(function(batch){
      if(!batch.length)return all;
      return Promise.all(batch.map(entryFiles)).then(function(lists){lists.forEach(function(l){all=all.concat(l);});return more();});
    });
  }
  return more();
}

  $(sources?'#openResults':'#openSources').removeAttribute('aria-current');
  srcView.hidden=!sources;
  if(sources){jumpTo(0);return;}
  cameFromDoc=false;placeRail();
  if(pendingClaim===null){jumpTo(paperY);return;}
  var i=pendingClaim;pendingClaim=null;
  items[i].el.scrollIntoView({block:'center',behavior:'instant'});focusItem(i,false);
}
function syncView(){showView(location.hash==='#sources');}
function openSources(needs,refId){
  if(needs!==null&&needs!==undefined)setNeedsOnly(needs);
  if(location.hash!=='#sources'){cameFromDoc=true;location.hash='sources';}
  showView(true);
  var row=refId&&document.getElementById('ref-'+refId);
  if(row)row.scrollIntoView({block:'center',behavior:'instant'});
}
function leaveSources(){if(cameFromDoc)history.back();else location.hash='';}
function showClaim(i){pendingClaim=i;leaveSources();}
$('#openSources').addEventListener('click',function(){openSources();});
$('#openResults').addEventListener('click',function(){if(!srcView.hidden)leaveSources();});
window.addEventListener('hashchange',syncView);
renderSrcLead();renderSrcFilter();renderSources();renderSugSum();renderNeedSrc();syncView();

/* ---------- theme ---------- */
$('#theme').addEventListener('click',function(){
  var root=document.documentElement;
  var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  var next=dark?'light':'dark';root.setAttribute('data-theme',next);
  try{localStorage.setItem('athetize-theme',next);}catch(e){}
});
try{var t=localStorage.getItem('athetize-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}

updateNav();
setTimeout(placeRail,200);
})();
</script>
</body>
</html>
